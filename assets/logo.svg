<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="100%" height="100%">
<defs>
<!-- Primary Gradient (#7ec6bc to #ebe717) -->
<linearGradient id="unfoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#7ec6bc" />
<stop offset="100%" stop-color="#ebe717" />
</linearGradient>
<!-- Dot Gradient -->
<linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#24a9ab" />
<stop offset="100%" stop-color="#ebe717" />
</linearGradient>
<!-- Accent Darker Teal Gradient for folded depth -->
<linearGradient id="unfoldDark" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#5fa39b" />
<stop offset="100%" stop-color="#7ec6bc" />
</linearGradient>
<!-- Subtle Drop Shadow -->
<filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
<feDropShadow dx="4" dy="8" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.12" />
</filter>
</defs>
<!-- Background Layer -->
<!-- <rect width="100%" height="100%" fill="#ffffff" /> -->
<g transform="translate(-40, -95)">
<!-- LOGO ICON (Geometric Unfolding Layers) -->
<g id="logo-mark" filter="url(#shadow)">
<!-- First Back/Base Layer (Teal/Base) -->
<path d="M 50 170 L 110 135 L 110 225 L 50 260 Z" fill="url(#unfoldDark)" opacity="0.85" />
<!-- Fold 1 (Mid Left - Shadow Side) -->
<path d="M 110 135 L 160 160 L 160 250 L 110 225 Z" fill="#6bb5a9" opacity="0.95" />
<!-- Fold 2 (Mid Right - Bright Front Face) -->
<path d="M 160 160 L 210 130 L 210 220 L 160 250 Z" fill="url(#unfoldGrad)" />
<!-- Fold 3 (Top Unfolding Layer / Yellow Focus) -->
<path d="M 210 130 L 260 100 L 260 190 L 210 220 Z" fill="#ebe717" />
<!-- Top Connecting Facets to give 3D Unfolding feel -->
<polygon points="50,170 110,135 160,160 100,195" fill="url(#unfoldGrad)" opacity="0.6" />
<polygon points="160,160 210,130 260,100 210,130" fill="#ebe717" opacity="0.8" />
</g>
<!-- TYPOGRAPHY -->
<g id="logo-text" transform="translate(310, 185)">
<style>
.text-etf {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
font-weight: 350;
font-size: 76px;
fill: #1e293b;
letter-spacing: -2.5px;
}
.text-unfold {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
font-weight: 700;
font-size: 76px;
fill: #1e293b;
letter-spacing: -2px;
}
</style>
<text x="-25" y="0">
<tspan class="text-etf">etf</tspan>
<tspan x="80" class="text-unfold">unfold</tspan>
</text>
<circle cx="65" cy="-10" r="10" fill="url(#dotGrad)" />
</g>
</g>
</svg>