<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img" aria-labelledby="title desc">
  <title id="title">JustETF Portfolio Exposure Analysis</title>
  <desc id="desc">An aggregated portfolio exposure chart with colored allocation segments next to the JustETF Portfolio name.</desc>
  <defs>
    <linearGradient id="logo-background" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3ffe7"/>
      <stop offset=".45" stop-color="#d9e7ff"/>
      <stop offset="1" stop-color="#f3e1b9"/>
    </linearGradient>
  </defs>

<!-- linear-gradient(90deg, #e3ffe7 0%, #d9e7ff 100%) -->

  <g transform="translate(12 12)">
    <rect width="136" height="136" rx="32" fill="url(#logo-background)"/>
    <path d="M68 29a39 39 0 0 1 35 22L68 68V29Z" fill="#ab0c0cbb" stroke="#fff" stroke-width="0"/>
    <path d="m103 51a39 39 0 0 1-7 42L68 68l35-17Z" fill="#61ccd8" stroke="#fff" stroke-width="0"/>
    <path d="M96 93a39 39 0 0 1-48 9l20-34 28 25Z" fill="#f6d57b" stroke="#fff" stroke-width="0"/>
    <path d="M48 102a39 39 0 0 1-19-34h39l-20 34Z" fill="#80d4a0" stroke="#fff" stroke-width="0"/>
    <path d="M29 68a39 39 0 0 1 39-39v39H29Z" fill="#9a5de5cc" stroke="#fff" stroke-width="0"/>
    <circle cx="68" cy="68" r="18" fill="#fff" opacity=".7"/>
    <!-- <circle cx="68" cy="68" r="6" fill="#17324d"/> -->
    <!-- <path d="M25 119h18v-10h10v10h18v-17h10v17h18v-27h10v27" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" opacity=".9"/> -->
  </g>

  <g fill="#17324d" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="178" y="88" font-size="48" font-weight="750" letter-spacing="-1.5">JustETF</text>
    <text x="180" y="119" fill="#5c7183" font-size="20" font-weight="600" letter-spacing="2.8">PORTFOLIO EXPOSURE</text>
    <text x="180" y="143" fill="#5c7183" font-size="16" font-weight="600" letter-spacing="3.2">ANALYSIS</text>
